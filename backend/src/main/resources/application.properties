spring.application.name=skillswap-backend
spring.datasource.url=jdbc:mysql://localhost:3306/skillswap_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Set JWT_SECRET to a Base64-encoded key of at least 32 bytes outside local development.
# Set CORS_ALLOWED_ORIGINS to the comma-separated list of trusted frontend origins.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8082
